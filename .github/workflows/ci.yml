name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        patch: [itlubs-1.1.3, xlat-v1.4.0-web-trigger]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake
      - name: apply ${{ matrix.patch }} on xlat v1.4.0 and build
        run: |
          git clone --branch v1.4.0 --depth 1 https://github.com/teamfinalmouse/xlat.git upstream
          cd upstream && git apply ../firmware/patches/${{ matrix.patch }}.patch
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=arm-none-eabi.cmake -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"
          arm-none-eabi-size xlat.elf
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build bridge/RabbitBridge.csproj -c Release
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
